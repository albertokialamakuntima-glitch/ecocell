name: Atualização diária (dados da NASA)
on:
  schedule:
    - cron: "0 23 * * *"   # 23:00 UTC = 00:00 em Luanda (UTC+1), todos os dias
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install earthengine-api numpy scipy pandas "shapely>=2" pycountry pycountry-convert pillow earthaccess netCDF4 xarray pydap
      - name: Recuperar os meses do AIRS já descarregados
        uses: actions/cache@v4
        with:
          path: airs_cache
          key: airs-${{ github.run_id }}
          restore-keys: airs-
      - name: Atualizar os dados da NASA e reconstruir o site
        run: python daily_update.py && python build_site.py
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      - name: Guardar as alterações
        run: |
          printf "airs_cache/\nairs_tmp/\n*.npz\n" >> .git/info/exclude
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "dados NASA $(date -u +%F)" || exit 0
          git push
