name: Reconstruir site
on:
  workflow_dispatch:
  push:
    paths:
      - "template.html"
      - "build_site.py"
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências (lista explícita)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas "shapely>=2" pycountry pycountry-convert pillow
          python -c "import numpy, pandas, shapely, pycountry, pycountry_convert, PIL; print('shapely', shapely.__version__)"
      - name: Reconstruir o site
        run: python build_site.py
      - name: Guardar as alterações
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "site reconstruído $(date -u +%F)" || exit 0
          git push
