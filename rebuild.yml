name: Reconstruir site
on:
  workflow_dispatch:
  push:
    paths:
      - "template.html"
      - "build_site.py"
      - "variaveis.json"
      - "cells.csv"
      - "meta.json"
permissions:
  contents: write
concurrency:            # nunca corre ao mesmo tempo que a atualização diária (esperam em fila)
  group: ecocell-site
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas "shapely>=2" pycountry pycountry-convert pillow
      - name: Reconstruir o site
        run: python build_site.py
      - name: Guardar as alterações
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "site reconstruído $(date -u +%F)" || exit 0
          # se entretanto alguém enviou ficheiros, junta-os primeiro e tenta outra vez (até 5 vezes)
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "O repositório mudou entretanto: a juntar as alterações (tentativa $i)..."
            sleep $((i * 5))
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          done
          exit 1
