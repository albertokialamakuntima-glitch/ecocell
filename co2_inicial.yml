name: CO2 e Sentinel-5P (primeira vez)
# Corre à mão (Actions > «CO2 e Sentinel-5P (primeira vez)» > Run workflow) para descarregar de uma vez o passado do CO2
# (OCO-2 e OCO-3, desde 2019) e o metano do Sentinel-5P, sem esperar pelas noites da atualização diária.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:            # nunca ao mesmo tempo que a atualização diária ou a reconstrução do site
  group: ecocell-site
  cancel-in-progress: false
jobs:
  inicial:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install earthengine-api numpy scipy pandas "shapely>=2" pycountry pycountry-convert pillow earthaccess netCDF4 xarray pydap
      - name: Recuperar o que já foi descarregado
        uses: actions/cache@v4
        with:
          path: airs_cache
          key: airs-${{ github.run_id }}
          restore-keys: airs-
      - name: Descarregar o CO2 e o Sentinel-5P e reconstruir o site
        run: |
          python co2_baixar.py || echo "::warning::CO2 ainda incompleto"
          python s5p_exportar.py || echo "::warning::Sentinel-5P falhou"
          python variaveis_exportar.py
          python variaveis_tendencias.py
          python build_site.py
        env:
          CO2_MINUTOS: "240"
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      - name: Guardar as alterações
        run: |
          printf "airs_cache/\nairs_tmp/\n*.npz\n" >> .git/info/exclude
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "CO2 e Sentinel-5P $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          done
          exit 1
